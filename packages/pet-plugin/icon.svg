<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="昔涟桌宠">
  <!-- 昔涟桌宠 · 插件图标（自绘，仅用项目配色，不含任何受版权保护的素材） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a52"/>
      <stop offset="1" stop-color="#241a35"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc2e2"/>
      <stop offset="1" stop-color="#e58cc0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- 后面的圆月 -->
  <circle cx="88" cy="38" r="17" fill="#ffe9a8" opacity="0.9"/>
  <circle cx="81" cy="34" r="15" fill="url(#bg)"/>

  <!-- 头部（简化轮廓） -->
  <path d="M64 40c19 0 31 13 31 31 0 20-13 33-31 33S33 91 33 71c0-18 12-31 31-31z" fill="url(#hair)"/>

  <!-- 刘海 -->
  <path d="M64 40c19 0 31 13 31 31-6-9-11-13-16-12-3 5-9 8-15 8s-12-3-15-8c-5-1-10 3-16 12 0-18 12-31 31-31z" fill="#fff1f7" opacity="0.55"/>

  <!-- 眼睛（眯眼笑，呼应"被摸头"的反应） -->
  <path d="M48 76c3-5 9-5 12 0" stroke="#4a2b46" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M68 76c3-5 9-5 12 0" stroke="#4a2b46" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 腮红 -->
  <ellipse cx="45" cy="86" rx="6" ry="3.5" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="83" cy="86" rx="6" ry="3.5" fill="#ff8fb8" opacity="0.55"/>

  <!-- 小星星 -->
  <path d="M26 30l2.6 6.4L35 39l-6.4 2.6L26 48l-2.6-6.4L17 39l6.4-2.6z" fill="#ffe9a8"/>
</svg>
