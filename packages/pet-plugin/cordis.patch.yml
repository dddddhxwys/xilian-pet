# 昔涟桌宠 Host 插件挂载层
#
# 两种挂载方式，任选其一：
#
# 【方式 1｜bundle 安装（推荐，走 GUI 插件管理页）】
#   本文件随 packages/pet-plugin 作为 bundle 一起被安装，下面的 insert 会用包名解析。
#
# 【方式 2｜免安装直挂（最快，改 profile 的 cordis.patch.yml）】
#   把下面 name 换成 index.js 的绝对路径或 file URL，即可完全不安装包：
#     - insert:
#         - id: xilian-pet
#           name: 'file:///C:/Users/怒C大伟出奇迹/dsh-projects/xilian%20pet/packages/pet-plugin/index.js'
#   （官方契约：插入条目的 name 可以是包标识符、绝对文件系统路径或 file URL）

- insert:
    - id: xilian-pet
      name: '@local/xilian-pet-plugin'
      config:
        # 路由前缀。刻意避开 /api —— /api 是 dsh-client-connection 的 prefix 路由，
        # 带自己的准入校验（未通过直接 401），exact 路由挂在它下面会被前缀规则吞掉。
        pathPrefix: '/xilian-pet'
        # 保留最近多少条原始事件的“形状样本”（**按 channel 分别计数** —— 全局环形
        # 会被高频的 agent/assistant-stream 刷爆，导致其他事件的样本全被挤掉）
        captureRawShapes: 20
        # 状态切换最短保持时间（毫秒），防事件突发导致闪烁
        minHoldMs: 500
        # ── A7 主动提醒（reminders）已**整体删除**（2026-10-11，用户："取消这个通知条功能"）
        #
        # 删掉的是：审批积压 / 久坐 / 花销三类提醒 + 通知条 + 点击唤回 DSH。
        # 所以这里**不再有 `reminders:` 配置块** —— 写它也不会生效（代码里没有消费者）。
        # ⚠️ profile 里若还留着旧的 `reminders:` 覆盖，属无害残留（未知键被忽略），
        #    但建议一并清掉，免得下一个人以为它还管用。
        # ── 审批：由桌宠同意（整块可省略；**默认开启**，写 false 才关）────
        #
        # 开启后插件会以 prepend 抢在"转发给 GUI 的桥"前面应答 approval/request：
        #   · 桌宠点「允许」→ 返回 allowed-once；点「拒绝」→ 返回 rejected
        #   · **桌宠没连上 → 立刻交棒给 GUI**（行为与没开时完全一致，绝不把审批卡住）
        #   · 桌宠连着但没人点 → 等 timeoutMs 之后交棒
        # ⚠️ 审批链是**顺序**的：我们持着请求时 GUI 的提示不会弹，
        #    所以要等 timeoutMs（默认 60 秒）才会交棒过去。
        #
        # 2026-10-06：默认由**关**改成**开**。原来 opt-in，结果凡是从手写 patch
        # 那条路装出来的人（config 里没有 approval 键）审批都静默走 GUI —— 朋友实测
        # 报的就是"审批没走桌宠"。写 false 即可完全关掉。
        approval:
          viaPet: true # 写 false 可完全关掉
          timeoutMs: 60000 # 超时后交棒给 GUI（5s~300s）
