<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'" />
    <title>西莲</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- 宠物本体：透明区域必须让鼠标穿透，所以整窗默认穿透，由 alpha 掩码决定何时接管 -->
    <div id="stage">
      <div id="halo" data-state="idle"></div>
      <img id="pet" src="assets/placeholder.png" alt="西莲" draggable="false" />
      <div id="badge" hidden></div>

      <div id="bubble" hidden>
        <div id="bubbleText"></div>
      </div>

      <form id="composer" hidden>
        <input id="composerInput" type="text" placeholder="给 agent 派个活…" autocomplete="off" />
        <button type="submit">派活</button>
        <button type="button" id="interruptBtn" title="打断当前回合">打断</button>
      </form>

      <div id="status" title="SSE 连接状态"></div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
