<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP 说明（改动前务必读）：
        · script-src 必须含 'wasm-unsafe-eval' —— Cubism Core 是 WebAssembly 构建，
          没有它 WebAssembly.instantiate 会被 CSP 拦掉，模型直接加载失败。
        · 页面与模型都走 pet://app（同一个 host）→ 都是 'self'，
          所以不需要额外列 pet:，这比显式放行整个 scheme 更严。
        · connect-src 'self' —— 渲染端只 XHR 同源的模型文件；SSE 在主进程里连。
        · 刻意不给 'unsafe-eval'：PixiJS 需要它生成着色器，改用官方 @pixi/unsafe-eval 替代。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:"
    />
    <title>昔涟</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- 宠物本体：透明区域必须让鼠标穿透，所以整窗默认穿透，由 alpha 掩码决定何时接管 -->
    <div id="stage">
      <!-- Live2D 渲染面。模型加载失败时保持隐藏，改用下面的占位图（验收项 A10 降级） -->
      <canvas id="live2dCanvas"></canvas>
      <img id="petSprite" src="assets/placeholder.png" alt="昔涟" draggable="false" />
      <!--
        曾经这里有个 #halo：她背后那团随状态变色的光晕（running 时绿色、还会呼吸）。
        按用户要求**已去掉**（2026-10-05："把那个光球特效去掉"）。
        曾经还有个 #badge（未读 +N 背板）：按用户要求**也已去掉**
        （2026-10-05："把未读功能去除"）。状态现在只靠动作/表情表达。
      -->

      <div id="bubble" hidden>
        <div id="bubbleText"></div>
      </div>

      <!--
        A7 主动提醒（审批积压 / 久坐 / 花销）。
        与气泡的区别：气泡是"它现在在干什么"的流水，会自动消失；
        通知是"要你注意/要你动手"，urgent 的一直留着直到你点它。
        点击 → 把 DSH 窗口唤到前台（见 main.js 的 pet:focus-dsh）。
      -->
      <div id="notice" hidden>
        <span id="noticeDot"></span>
        <span id="noticeText"></span>
        <span id="noticeHint">点击回到 DSH</span>
      </div>

      <!--
        审批**不在这里**画：她头顶只有约 87px 留白，审批卡（工具名 + 命令 + 两个按钮）
        塞不下，必然遮住她本体（用户实测："审批弹窗遮到角色了"）。
        审批走**专用小窗**：main.js 的 openApprovalWindow() → renderer/approval.html。
      -->

      <!--
        曾经这里有个 #status（右下角"插件在线"小绿点）：
        按用户要求**挪进操作面板**了（2026-10-05："把那个表示插件在线的小绿点整合到菜单里面去"）。
        理由：她本体占满 260×300，那个点只能压在她身上；面板本来就是看状态/下命令的地方 ✓
      -->
    </div>

    <!--
      加载顺序不能变：
        0. process-shim.js          → 补 window.process（cubism4 的 UMD 引用了 process.env.NODE_ENV）
        1. pixi.min.js              → window.PIXI
        2. unsafe-eval.min.js       → 让 PixiJS 在禁 eval 的 CSP 下也能生成着色器（必须在 pixi 之后）
        3. live2dcubismcore.min.js  → window.Live2DCubismCore（官方 Core，含 MocVersion_50）
        4. cubism4.min.js           → window.PIXI.live2d（依赖前面四个）
      这五个都是普通 <script>（它们本来就挂全局），由
      tools/prepare-renderer-vendor.mjs 生成，不入库。

      注意这里**没有** live2d.js —— 它是 ES 模块，由 pet.js 用动态 import 加载
      （模块自带作用域，避免与 pet.js 的顶层声明撞名；用动态是为了失败仍能降级）。
    -->
    <script src="vendor/process-shim.js"></script>
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/unsafe-eval.min.js"></script>
    <script src="vendor/live2dcubismcore.min.js"></script>
    <script src="vendor/cubism4.min.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
