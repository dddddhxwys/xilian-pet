<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      设置小窗。
      入口两个：托盘「设置…」+ 面板右上角 ⚙。
      阶段 4 先接「外观 · 大小」：滑杆 0.6–1.6，拖动即时生效并写盘。
      其余项（不透明度 / 镜像 / 行为开关）在后续小步里接进来。
      CSP：只用本地文件、无 eval；头像来自 packages/pet-plugin/icon.webp（file: 放行）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file:"
    />
    <title>昔涟 · 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div id="settings">
      <header>
        <img id="avatar" src="../../../packages/pet-plugin/icon.webp" alt="" />
        <b>昔涟 · 设置</b>
        <button type="button" id="close" class="icon" title="关闭（Esc）">✕</button>
      </header>

      <div class="sec">外观</div>
      <div class="row">
        <span>大小</span>
        <div class="ctl">
          <input type="range" id="scale" min="0.6" max="1.6" step="0.05" value="1" />
          <b id="scaleVal">1.00×</b>
        </div>
      </div>
      <div class="row">
        <span>不透明度</span>
        <div class="ctl">
          <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="1" />
          <b id="opacityVal">100%</b>
        </div>
      </div>

      <div class="sec">关于</div>
      <div class="row">
        <span>版本</span>
        <b id="version">—</b>
      </div>

      <div class="note" id="note">拖动滑杆即时生效，会记住。</div>

      <footer>
        <button type="button" id="reset" class="ghost">恢复默认</button>
        <button type="button" id="done" class="primary">完成</button>
      </footer>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
