<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      独立小窗 = 桌宠的**操作面板**（只有**右键她**这一条路会弹这个窗口）。
      ⚠️ 这里原来写着"右键她 / 双击她都弹这个" —— **双击已经不做任何事**了
      （用户 2026-10-05 明确要求去掉"双击唤起面板"，见 pet.js 的 contextmenu 段）。
      过期注释比没有注释更糟：README 里的交互说明就被它带错过一次。
      为什么都塞在这里：桌宠窗口只有 260×300，她本体占满，
      在里面放输入条必然压住她的裙摆和脚（实测 28px 重叠），也没地方放会话列表。
      所以：底部那条输入条整个删掉，操作全搬到这里。

      内容：
        · 头部 —— 项目图标 + 昔涟 + ⚙（面板里**只放这一个设置入口**，用户要求）
        · 派活目标 —— 最近 3 个会话，点一行切换（**只切换"派活发给谁"，不是切 DSH 界面**）
        · 多行输入（Enter 发送 / Shift+Enter 换行）
        · 派活 / 打断
        · 一行状态：本次 tokens · 缓存命中 · 插件（SSE）连接状态

      阶段 3 换皮：珍珠白 + 星星暗纹 + 字号三档（token 见 tokens.css）。
      CSP：只有本地文件，不加载 PixiJS/Live2D，所以不需要 eval 相关放行；
           头像来自 packages/pet-plugin/icon.webp（file: 放行）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file:"
    />
    <title>昔涟 · 菜单</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div id="menu">
      <!-- 头部：头像 + 名字 + ⚙（设置项不铺进面板，只放这一个按钮） -->
      <div class="hd">
        <img class="avatar" src="../../../packages/pet-plugin/icon.webp" alt="" />
        <b>昔涟</b>
        <button type="button" id="settingsBtn" class="gear" title="设置" aria-label="打开设置">⚙</button>
      </div>

      <div class="section-label">派活目标</div>
      <!-- 折叠态：只显示当前目标 + 箭头；点它才展开列表（用户要求折叠起来） -->
      <button type="button" id="target" class="target" aria-expanded="false">
        <span class="dot" id="targetDot"></span>
        <span class="title" id="targetTitle">—</span>
        <span class="chevron" id="targetChevron">▾</span>
      </button>
      <div id="sessions" class="sessions" hidden></div>

      <div class="sep"></div>

      <textarea id="input" rows="3" placeholder="给 agent 派个活…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="actions">
        <button type="button" id="send" class="item primary">派活</button>
        <button type="button" id="interrupt" class="item danger">打断</button>
      </div>

      <div class="sep"></div>
      <!-- 三行压成一行（阶段 3）：本次 tokens · 缓存命中 · 插件连接状态。
           保留原 ID（#tokens / #cache / #linkState），menu.js 不用改。 -->
      <div class="status">
        <span class="k">本次</span><b id="tokens">—</b>
        <span class="k">缓存</span><b id="cache">—</b>
        <b id="linkState" data-link="down">未连接</b>
      </div>

      <div id="hint" class="hint" hidden></div>
    </div>
    <script src="menu.js"></script>
  </body>
</html>
